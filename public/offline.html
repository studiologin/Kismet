<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07060d" />
<title>Sem conexão · Kismet</title>
<style>
  html,body{margin:0;height:100%;background:#07060d;color:#f4f1ea;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
  img{width:88px;height:88px;border-radius:22px;margin-bottom:20px}
  h1{font-size:26px;margin:0 0 8px}
  p{color:#a8a4c0;margin:0 0 24px;line-height:1.5}
  button{background:#f4f1ea;color:#07060d;border:0;border-radius:16px;padding:14px 22px;font-weight:800;font-size:15px}
</style>
</head>
<body>
<main>
  <div>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sem conexão</h1>
    <p>O Kismet precisa de internet para sincronizar a partida.<br />Assim que o sinal voltar, é só tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</main>
</body>
</html>
